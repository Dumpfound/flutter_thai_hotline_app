name: flutter_thai_hotline_app
description: สายด่วน THAILAND - Thai Hotline App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/me.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/me.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
